[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "grokbot-davinci"
version = "0.6.0"
description = "Outbound-only, locally approved DaVinci Resolve editing MCP connector"
requires-python = ">=3.12"
dependencies = ["mcp==1.30.0", "httpx>=0.28,<1", "uvicorn>=0.35,<1", "rfc8785>=0.1.4,<1"]
[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]
[project.scripts]
grokbot-davinci-relay = "grokbot_davinci.relay:main"
grokbot-davinci-worker = "grokbot_davinci.worker:main"
grokbot-davinci-approve = "grokbot_davinci.approval:main"
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
